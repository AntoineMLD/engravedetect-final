name: CI/CD Pipeline - EngraveDetect

on:
  push:
    branches: [ "main", "ci/cd", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Empêche l’empilement de runs pour la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  # Pour torch CPU (on l'utilise seulement via --index-url plus bas, mais au cas où)
  TORCH_CPU_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  # =========================
  # Tests unitaires & intégration
  # =========================
  unit-tests:
    name: Tests Unitaires & Intégration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Cache pip (wheel & http)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pip-tools
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml', 'setup.cfg', 'setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          unixodbc-dev libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 libasound2t64

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    # 1) Dépendances de base (ne tire pas torch GPU)
    - name: Install base deps
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    # 2) Torch/torchvision CPU — UNE SEULE FOIS pour tout le repo
    #    (aligne toute la stack Torch côté CI)
    - name: Install torch CPU wheels
      run: |
        pip install --index-url "$TORCH_CPU_INDEX_URL" \
          torch==2.2.0 torchvision==0.17.0
        # Optionnel: on fige numpy cohérente
        pip install "numpy==1.26.4"

    # 3) Installe le projet sans re-tirer les deps lourdes
    - name: Install project (editable, no heavy deps)
      run: pip install -e . --no-deps

    # 4) Dépendances API IA sans redemander torch & co
    - name: Install API IA deps (no heavy deps)
      run: |
        if [ -f src/api_ia/requirements-compatible.txt ]; then
          pip install -r src/api_ia/requirements-compatible.txt --no-deps || true
        fi
        if [ -f src/api_ia/requirements.txt ]; then
          pip install -r src/api_ia/requirements.txt --no-deps || true
        fi

    # 5) Diagnostic
    - name: Diagnose dependencies (optional)
      run: |
        python scripts/diagnose_dependencies.py || echo "Diagnostic indisponible"

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=${PYTHONPATH}:$(pwd)/src" >> $GITHUB_ENV
        echo "PYTHONPATH=${PYTHONPATH}:$(pwd)" >> $GITHUB_ENV

    - name: Run unit & integration tests
      env:
        ENVIRONMENT: "test"
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        database_url: "sqlite:///./test.db"
      run: |
        mkdir -p test-results
        # 1) Tests sans torch
        python -m pytest tests/ -v --ignore=tests/test_playwright_e2e.py -m "not torch" --tb=short --junitxml=test-results/junit-core.xml
        # 2) Tests torch (si marqués)
        python -m pytest tests/ -v -m "torch" --tb=short --junitxml=test-results/junit-torch.xml || echo "Tests PyTorch skipés - dépendances non disponibles"
        # 3) API IA (rapides/mocks)
        python -m pytest tests/test_routes/test_api_ia_dependencies.py -v --tb=short --junitxml=test-results/junit-api-ia-deps.xml
        python -m pytest tests/test_routes/test_api_ia_simple.py -v --tb=short --junitxml=test-results/junit-api-ia-simple.xml
        python -m pytest tests/test_routes/test_api_ia_mocked.py -v --tb=short --junitxml=test-results/junit-api-ia-mocked.xml
        # 4) API IA intégration (best effort)
        python -m pytest tests/test_routes/test_api_ia_integration.py -v --tb=short --junitxml=test-results/junit-api-ia-int.xml || echo "Tests API IA complets skipés"

    - name: Upload test results (JUnit)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-and-integration-tests
        path: test-results/
        retention-days: 14

  # =========================
  # Tests E2E Playwright
  # =========================
  e2e-tests:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Cache pip (wheel & http)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pip-tools
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml', 'setup.cfg', 'setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install base deps (no heavy ML)
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e . --no-deps

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright browsers
      run: |
        npx --yes playwright install chromium
        # ou: playwright install chromium

    - name: Run Playwright E2E tests
      env:
        ENVIRONMENT: "test"
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        TEST_URL: "https://engravedetect.fr"
        PLAYWRIGHT_BROWSER: "chromium"
        PLAYWRIGHT_HEADLESS: "true"
        PLAYWRIGHT_TIMEOUT: "30000"
        database_url: "sqlite:///./test.db"
      run: |
        mkdir -p test-results
        python -m pytest tests/test_playwright_e2e.py -v --disable-warnings --junitxml=test-results/results.xml --tb=short

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

    - name: Upload Playwright screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-screenshots
        path: test-results/
        retention-days: 14

  # =========================
  # Build Docker (avec cache)
  # =========================
  docker:
    name: Build Docker Images
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build API BDD image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        tags: api_bdd:latest
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Build API IA image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.api_ia
        tags: api_ia:latest
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Build Nginx image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.nginx
        tags: nginx_proxy:latest
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    # Déplace le cache pour le run suivant
    - name: Move Docker layer cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
