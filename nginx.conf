events {}

http {
  server {
    listen 80;
    server_name _;

    # ---------------------
    # Sécurité HTTP stricte et complète
    add_header Content-Security-Policy "\
      default-src 'self';\
      script-src 'self';\
      style-src 'self';\
      img-src 'self' data:;\
      font-src 'self';\
      connect-src 'self' http://localhost:8000 http://localhost:8001;\
      object-src 'none';\
      form-action 'self';\
      base-uri 'self';\
      frame-ancestors 'none';\
      manifest-src 'self';\
      media-src 'none';\
      worker-src 'none';\
      child-src 'none';\
      frame-src 'none';\
      upgrade-insecure-requests;\
    " always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---------------------
    # Masquer le header Server
    server_tokens off;
    proxy_hide_header Server;

    # ---------------------
    # Proxy /api vers le service api
    location /api/ {
      proxy_pass http://api:8000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------
    # Proxy /api_ia vers le service api_ia (si tu en as besoin)
    location /api_ia/ {
      proxy_pass http://api_ia:8000/api_ia/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------
    # Proxy pass vers le service front
    location / {
      proxy_pass http://front:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
