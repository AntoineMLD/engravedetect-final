# pytest.ini
[tool:pytest]
# Configuration pytest pour les tests Playwright

# Marqueurs personnalisés
markers =
    playwright: Tests utilisant Playwright
    e2e: Tests end-to-end
    slow: Tests lents (peuvent être désactivés en CI)
    performance: Tests de performance
    accessibility: Tests d'accessibilité
    api_ia: Tests de l'API IA
    integration: Tests d'intégration
    authentication: Tests d'authentification
    ai_endpoints: Tests des endpoints d'IA
    security: Tests de sécurité
    stress: Tests de stress
    unit: Tests unitaires

# Configuration des tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut (fusionnées)
addopts = 
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    --maxfail=5
    --durations=10
    -n auto
    --dist=worksteal

# Configuration pour les tests Playwright
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Timeouts
timeout = 30
timeout_method = thread

# Variables d'environnement pour les tests
env =
    CI=false
    PYTEST_DISABLE_PLUGIN_AUTOLOAD=true
