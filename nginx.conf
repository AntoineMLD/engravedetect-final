events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;

        # ---------------------
        # Sécurité HTTP stricte
        add_header Content-Security-Policy "\
            default-src 'self';\
            script-src 'self' 'unsafe-inline';\
            style-src 'self' 'unsafe-inline';\
            img-src 'self' data:;\
            font-src 'self';\
            connect-src 'self' http://localhost:8000 http://localhost:8001;\
            object-src 'none';\
            form-action 'self';\
            base-uri 'self';\
            frame-ancestors 'none';\
            manifest-src 'self';\
            media-src 'none';\
            worker-src 'none';\
            child-src 'none';\
            frame-src 'none';\
            upgrade-insecure-requests;\
        " always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ---------------------
        # Masquer le header Server
        server_tokens off;
        proxy_hide_header Server;

        # ---------------------
        # Proxy /api vers API classique
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------
        # Proxy /api_ia vers API IA
        location /api_ia/ {
            rewrite ^/api_ia/(.*)$ /$1 break;
            proxy_pass http://api_ia:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------
        # Reverse proxy Grafana sur /dash
        location = /dash {
            return 301 /dash/;
        }

        location /dash/ {
            proxy_pass http://grafana:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /dash;
        }

        # ---------------------
        # Fichiers statiques du front
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
