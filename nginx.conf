events {}

http {
  # -----------------------
  # REDIRECTION TOUT HTTP VERS HTTPS
  server {
    listen 80;
    server_name engravedetect.fr www.engravedetect.fr;

    # Redirige tout vers HTTPS
    return 301 https://$host$request_uri;
  }

  # -----------------------
  # SERVEUR HTTPS
  server {
    listen 443 ssl http2;
    server_name engravedetect.fr www.engravedetect.fr;

    # Certificats Let's Encrypt (adapte tes chemins)
    ssl_certificate     /etc/letsencrypt/live/engravedetect.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engravedetect.fr/privkey.pem;

    # Protocoles modernes uniquement
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256';
    ssl_prefer_server_ciphers on;

    # Sécurité HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # -----------------------
    # Sécurité headers
    add_header Content-Security-Policy "\
      default-src 'self';\
      script-src 'self';\
      style-src 'self';\
      img-src 'self' data:;\
      font-src 'self';\
      connect-src 'self' https://engravedetect.fr/api/ https://engravedetect.fr/api_ia/;\
      object-src 'none';\
      form-action 'self';\
      base-uri 'self';\
      frame-ancestors 'none';\
      manifest-src 'self';\
      media-src 'none';\
      worker-src 'none';\
      child-src 'none';\
      frame-src 'none';\
      upgrade-insecure-requests;\
    " always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------
    # Masquer le header Server
    server_tokens off;
    proxy_hide_header Server;

    # -----------------------
    # Proxy /api vers le service api
    location /api/ {
      proxy_pass http://api:8000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------
    # Proxy /api_ia vers le service api_ia
    location /api_ia/ {
      rewrite ^/api_ia/(.*)$ /$1 break;
      proxy_pass http://api_ia:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------
    # Proxy vers le front
    location / {
      proxy_pass http://front:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}