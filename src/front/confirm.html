<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation d'email - EngraveDetect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="confirmationStatus" class="confirmation-status">
            <div class="loading">Confirmation de votre email en cours...</div>
            <div class="success hidden">
                <h2>✅ Email confirmé avec succès !</h2>
                <p>Vous allez être redirigé vers la page de connexion...</p>
            </div>
            <div class="error hidden">
                <h2>❌ Erreur de confirmation</h2>
                <p id="errorMessage">Une erreur est survenue lors de la confirmation de votre email.</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showError("Token de confirmation manquant.");
                return;
            }

            try {
                const response = await fetch('/api/v1/auth/confirm?token=' + token);
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess();
                    // Redirection après 3 secondes
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 3000);
                } else {
                    showError(data.detail || "Erreur lors de la confirmation de l'email.");
                }
            } catch (error) {
                showError("Erreur de connexion au serveur.");
            }
        });

        function showSuccess() {
            document.querySelector('.loading').classList.add('hidden');
            document.querySelector('.success').classList.remove('hidden');
            document.querySelector('.error').classList.add('hidden');
        }

        function showError(message) {
            document.querySelector('.loading').classList.add('hidden');
            document.querySelector('.success').classList.add('hidden');
            document.querySelector('.error').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = message;
        }
    </script>
</body>
</html>
