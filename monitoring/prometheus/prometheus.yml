global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'api_ia'
    static_configs:
      - targets: ['api_ia:8000']
        labels:
          service: 'api_ia'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
