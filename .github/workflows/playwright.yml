name: Playwright E2E Tests

on:
  push:
    branches: [ "main", "develop", "ci/cd" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)/src" >> $GITHUB_ENV
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

    - name: Install Playwright browsers
      run: |
        playwright install chromium

    - name: Run Playwright E2E tests
      env:
        ENVIRONMENT: "test"
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        # Variables de base de données locales pour les tests
        DATABASE_URL: "sqlite:///./test.db"
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        TEST_URL: "https://engravedetect.fr"
        PLAYWRIGHT_BROWSER: "chromium"
        PLAYWRIGHT_HEADLESS: "true"
        PLAYWRIGHT_TIMEOUT: "30000"
        PYTEST_TIMEOUT: "300"
        database_url: "sqlite:///./test.db"
      run: |
        python -m pytest tests/test_playwright_e2e.py -v --disable-warnings --junitxml=test-results/results.xml

    - name: Upload Playwright test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Playwright screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-screenshots
        path: test-results/
        retention-days: 30

    - name: Upload test results XML
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-xml
        path: test-results/results.xml
        retention-days: 30

    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          try {
            const resultsPath = 'test-results/results.xml';
            if (fs.existsSync(resultsPath)) {
              const results = fs.readFileSync(resultsPath, 'utf8');
              const testsMatch = results.match(/tests="(\d+)"/);
              const failuresMatch = results.match(/failures="(\d+)"/);
              const errorsMatch = results.match(/errors="(\d+)"/);
              
              const tests = testsMatch ? testsMatch[1] : '0';
              const failures = failuresMatch ? failuresMatch[1] : '0';
              const errors = errorsMatch ? errorsMatch[1] : '0';
              
              const comment = `## 🧪 Tests E2E Playwright - Résultats
              
              **Statut :** ${failures === '0' && errors === '0' ? '✅ Succès' : '❌ Échec'}
              
              - **Tests exécutés :** ${tests}
              - **Échecs :** ${failures}
              - **Erreurs :** ${errors}
              
              ${failures === '0' && errors === '0' 
                ? '🎉 Tous les tests E2E passent avec succès !' 
                : '⚠️ Certains tests ont échoué. Consultez les artefacts pour plus de détails.'}`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (error) {
            console.log('Erreur lors de la génération du commentaire:', error);
          } 