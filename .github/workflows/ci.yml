name: CI/CD Pipeline - EngraveDetect

on:
  push:
    branches: [ "main", "ci/cd", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # Tests unitaires et d'intégration
  unit-tests:
    name: Tests Unitaires & Intégration
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev
        sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 libasound2t64

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)/src" >> $GITHUB_ENV
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

    - name: Run unit and integration tests
      env:
        ENVIRONMENT: "test"
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        AZURE_SERVER: ${{ secrets.AZURE_SERVER }}
        AZURE_DATABASE: ${{ secrets.AZURE_DATABASE }}
        AZURE_USERNAME: ${{ secrets.AZURE_USERNAME }}
        AZURE_PASSWORD: ${{ secrets.AZURE_PASSWORD }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        database_url: "sqlite:///./test.db"
      run: |
        python -m pytest tests/ -v --ignore=tests/test_playwright_e2e.py

  # Tests E2E avec Playwright
  e2e-tests:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install system dependencies for Playwright
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libglib2.0-0 \
          libsm6 \
          libxext6 \
          libxrender-dev \
          libgomp1 \
          libnss3 \
          libatk-bridge2.0-0 \
          libdrm2 \
          libxkbcommon0 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libgbm1 \
          libpango-1.0-0 \
          libcairo2 \
          libasound2t64 \
          libgl1-mesa-dri

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)/src" >> $GITHUB_ENV
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

    - name: Install Playwright browsers
      run: |
        playwright install
        playwright install-deps

    - name: Run Playwright E2E tests
      env:
        ENVIRONMENT: "test"
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        AZURE_SERVER: ${{ secrets.AZURE_SERVER }}
        AZURE_DATABASE: ${{ secrets.AZURE_DATABASE }}
        AZURE_USERNAME: ${{ secrets.AZURE_USERNAME }}
        AZURE_PASSWORD: ${{ secrets.AZURE_PASSWORD }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        TEST_URL: "https://engravedetect.fr"
        PLAYWRIGHT_BROWSER: "chromium"
        PLAYWRIGHT_HEADLESS: "true"
        PLAYWRIGHT_TIMEOUT: "30000"
        database_url: "sqlite:///./test.db"
      run: |
        python -m pytest tests/test_playwright_e2e.py -v --headed=false --disable-warnings

    - name: Upload Playwright test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Playwright screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-screenshots
        path: test-results/
        retention-days: 30

  # Build et déploiement Docker
  docker:
    name: Build Docker Image
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t api_bdd .

    - name: Build API IA Docker image
      run: docker build -f Dockerfile.api_ia -t api_ia .

    - name: Build Nginx Docker image
      run: docker build -f Dockerfile.nginx -t nginx_proxy .