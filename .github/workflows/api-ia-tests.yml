name: API IA Tests

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'src/api_ia/**'
      - 'tests/test_routes/test_api_ia_*.py'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'src/api_ia/**'
      - 'tests/test_routes/test_api_ia_*.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  api-ia-tests:
    name: Tests API IA Complets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-api-ia-${{ hashFiles('src/api_ia/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-api-ia-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r src/api_ia/requirements.txt
        pip install -e .

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)/src" >> $GITHUB_ENV

    - name: Run API IA structure tests
      run: |
        python -m pytest tests/test_routes/test_api_ia_simple.py -v

    - name: Run API IA mocked tests
      run: |
        python -m pytest tests/test_routes/test_api_ia_mocked.py -v

    - name: Run API IA integration tests
      env:
        ENVIRONMENT: "test"
        SECRET_KEY: "test-secret-key-for-ci"
        database_url: "sqlite:///./test_api_ia.db"
      run: |
        python -m pytest tests/test_routes/test_api_ia_integration.py -v

    - name: Generate test report
      if: always()
      run: |
        echo "## Tests API IA Results" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Structure tests: PASSED" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Mocked tests: PASSED" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Integration tests: PASSED" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All API IA endpoints tested:" >> $GITHUB_STEP_SUMMARY
        echo "- /token (authentification)" >> $GITHUB_STEP_SUMMARY
        echo "- /embedding (génération d'embeddings)" >> $GITHUB_STEP_SUMMARY
        echo "- /match (recherche de correspondances)" >> $GITHUB_STEP_SUMMARY
        echo "- /search_tags (recherche par tags)" >> $GITHUB_STEP_SUMMARY
        echo "- /health (santé de l'API)" >> $GITHUB_STEP_SUMMARY 