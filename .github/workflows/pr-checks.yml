name: PR Checks - Fast

on:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Tests unitaires rapides
  quick-tests:
    name: Tests Rapides
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)/src" >> $GITHUB_ENV
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

    - name: Run quick tests
      env:
        ENVIRONMENT: "test"
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        database_url: "sqlite:///./test.db"
      run: |
        # Tests unitaires seulement (pas d'E2E)
        python -m pytest tests/ -v --ignore=tests/test_playwright_e2e.py --tb=short -x --maxfail=3
        
        # Tests API IA rapides (structure et mocks)
        python -m pytest tests/test_routes/test_api_ia_simple.py -v
        python -m pytest tests/test_routes/test_api_ia_mocked.py -v

  # Lint et format
  code-quality:
    name: Qualité du Code
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install linting tools
      run: |
        pip install flake8 black isort

    - name: Check code formatting
      run: |
        black --check --diff .
        isort --check-only --diff .

    - name: Run linter
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics 